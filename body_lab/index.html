<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Body Lab — The Human Lab | Salt Rock</title>
<meta name="description" content="Discover The Body Lab at The Human Lab, Salt Rock. Considered massage, unhurried touch and private moments of calm. By appointment only.">
<meta property="og:image" content="https://humanlabofficial.com/body_lab/hero.jpg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz@0,9..144,400;1,9..144,400&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F7F5;--ink:#1A1816;--rust:#8C3A2E;--taupe:#B7ADA2;--line:rgba(26,24,22,0.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;line-height:1.7}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:400;letter-spacing:-0.025em;line-height:1.15}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--taupe)}
nav{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(248,247,245,0.94);backdrop-filter:blur(12px);z-index:10}
.wrap{max-width:1000px;margin:0 auto;padding:64px 32px 0}
.lab-hero{margin:32px 0 0}
.lab-hero img{width:100%;height:52vh;max-height:620px;object-fit:cover;display:block;border-radius:2px;background:#EDE9E3}
.hero{padding:48px 0 56px;border-bottom:1px solid var(--line)}
/* ... keep rest of your CSS exactly as you pasted ... */
.treatment-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.treatment{background:var(--bg);padding:clamp(24px,4vw,40px)}
</style>
</head>
<body>
<nav><a href="/"><strong>THE HUMAN LAB</strong><span style="opacity:.5"> — Salt Rock</span></a><a href="/#labs">The Labs</a></nav>
<main class="wrap">
  <a href="/" class="mono" style="text-decoration:none">← Back to The Human Lab</a>
  <header class="hero">
    <span class="mono">The Body Lab · 01 / 02</span>
    <h1>The Body Lab</h1>
    <p class="mono" style="margin-top:20px;color:var(--rust)">Massage · Unhurried touch · A quieter kind of luxury</p>
    
    <!-- ★ SWAPPABLE IMAGE: Upload hero.jpg into body_lab folder -->
    <figure class="lab-hero">
      <img src="hero.jpg" alt="The Body Lab massage studio Salt Rock" onerror="this.style.display='none'">
      <figcaption class="mono" style="margin-top:12px">Upload hero.jpg to /body_lab/ to change image</figcaption>
    </figure>

    <p style="max-width:620px;margin-top:32px;font-size:clamp(17px,2vw,20px);line-height:1.8">A private space to exhale.</p>
  </header>
  <!-- keep your treatments grid etc exactly as you had -->
</main>
</body>
</html>
